name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s dashboard/tests -v
      - run: node --check dashboard/static/app.js
      - run: python shortcuts/build_shortcuts.py --portable
      - run: python scripts/package_release.py --source-only
